<div class="col-span-2 my-9">
    <div class="relative rounded-sm overflow-hidden" style="background-image: radial-gradient(circle at 50% 0%, #3b82f6, #000 70%); background-size: 200% 200%; animation: gradient-shift 8s ease infinite">
        <div class="absolute inset-0 pointer-events-none" style="
            background-image:
                linear-gradient(rgba(255,255,255,0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(circle at center, black 15%, transparent 45%);
            -webkit-mask-image: radial-gradient(circle at center, black 15%, transparent 45%);
        "></div>
        <svg class="absolute inset-0 w-full h-full opacity-40 pointer-events-none" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
            <filter id="noise" x="0" y="0" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch" />
            </filter>
            <rect width="100%" height="100%" filter="url(#noise)" />
        </svg>
        <div class="relative z-10 flex items-center justify-center py-20 px-8">
            <p class="text-center text-xs md:text-sm text-white leading-relaxed tracking-tight uppercase" style="font-family: 'Departure Mono', monospace">
                Pay attention.
                <br />
                To what matters.
            </p>
        </div>
    </div>
</div>
